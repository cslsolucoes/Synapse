# dcc64.cfg - suite DUnitX das fork extensions ao Synapse v41.4
# Compatibilidade: Delphi 12+ (dcc64) e Lazarus/FPC (mode DELPHI).
# Uso: cd src/modules/Synapse/tests-extra && dcc64 ssl_openssl_icpbrasil_tests.lpr

# Delphi 12 RTL
-U"C:\Program Files (x86)\Embarcadero\Studio\23.0\lib\Win64\release"
-U"C:\Program Files (x86)\Embarcadero\Studio\23.0\lib\Win64\debug"
-I"C:\Program Files (x86)\Embarcadero\Studio\23.0\include\Win64"
-R"C:\Program Files (x86)\Embarcadero\Studio\23.0\lib\Win64\release"
-R"C:\Program Files (x86)\Embarcadero\Studio\23.0\lib\Win64\debug"

# DUnitX
-U"C:\Program Files (x86)\Embarcadero\Studio\23.0\source\DunitX"
-U"C:\Program Files (x86)\Embarcadero\Studio\23.0\source\DunitX\DUnitXIDEPlugin"

# Synapse fork (units .pas estao na raiz)
-U".."

# Build flags
-B
-NSSystem;System.Win;Vcl;DUnitX
-W-IMPLICIT_STRING_CAST
-W-IMPLICIT_STRING_CAST_LOSS

# Output - DCUs em -N0 (zero, nao "O")
-N0".\Compiled"
-E".\Compiled"

# Defines
-DUSE_OPENSSL3
-DLOGGER_OFF
